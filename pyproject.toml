[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zest-project-agent"
version = "0.1.0"
description = "A long-lived maintenance agent for a single project"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zest = "zest.cli:main"

[project.optional-dependencies]
ai = [
    "langchain>=1.4.5",
    "langchain-deepseek>=1.1.1",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "python-dotenv>=1.2.4",
]
mcp = [
    "fastmcp>=4.1.0",
    "langchain[mcp]>=1.4.5",
]

[tool.setuptools.packages.find]
include = ["zest*"]

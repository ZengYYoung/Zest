[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zest-project-agent"
version = "0.1.0"
description = "A long-lived maintenance agent for a single project"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zest = "zest.cli:main"

[project.optional-dependencies]
ai = [
    "pydantic>=2.12,<3",
    "langchain>=1.4.5",
    "langchain-deepseek>=1.1.1",
    "langsmith>=0.14.8",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-sqlite>=3.1.2",
    "python-dotenv>=1.2.4",
]
mcp = [
    "fastmcp>=4.1.0",
    "langchain[mcp]>=1.4.5",
]
web = [
    "fastapi>=0.143.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]
tui = [
    "textual>=8.2.8",
]

[tool.setuptools.packages.find]
include = ["zest*"]

[tool.setuptools.package-data]
zest = ["skills/*/SKILL.md"]

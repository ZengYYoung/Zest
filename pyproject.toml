[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zest-project-agent"
version = "0.1.0"
description = "A long-lived maintenance agent for a single project"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zest = "zest.cli:main"

[tool.setuptools.packages.find]
include = ["zest*"]
